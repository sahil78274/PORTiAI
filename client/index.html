<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PortiAI builds a professional portfolio from one of six templates: add your projects and experience, preview at any screen size and publish to a public link."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="PortiAI — a portfolio builder for your work" />
    <meta
      property="og:description"
      content="Six portfolio templates, a structured editor with live previews, an honest quality review and publishing to a public link."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>PortiAI — build a portfolio you can share</title>
    <script>
      /* Apply the saved (or system) theme before first paint to avoid a flash. */
      (function () {
        try {
          var stored = localStorage.getItem('portiai.theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b1120' : '#ffffff');
        } catch (error) {
          /* ignore: default light theme applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
