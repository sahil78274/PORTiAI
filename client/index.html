<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PortiAI is a portfolio platform for developers, designers, students and freelancers: 100+ premium portfolio templates, a live editor, an AI writing assistant and a public link you control."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="PortiAI — premium portfolio templates you can build on" />
    <meta
      property="og:description"
      content="Browse 100+ portfolio templates across ten layouts and ten visual styles, customise every section in a live editor, and publish to a public link."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>PortiAI — premium portfolio templates you can build on</title>
    <script>
      /* Apply the saved (or system) theme before first paint to avoid a flash. */
      (function () {
        try {
          var allowed = ['light', 'dark', 'midnight', 'purple', 'emerald', 'rose'];
          var stored = localStorage.getItem('portiai.theme');
          var darkThemes = ['dark', 'midnight', 'purple', 'emerald'];
          var theme = allowed.indexOf(stored) >= 0 ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var isDark = darkThemes.indexOf(theme) >= 0;
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          var colors = { light: '#ffffff', dark: '#0b1120', midnight: '#05070d', purple: '#0c0716', emerald: '#04120e', rose: '#fff7f8' };
          if (meta) meta.setAttribute('content', colors[theme] || '#ffffff');
        } catch (error) {
          /* ignore: default light theme applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
