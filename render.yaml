# Render blueprint for PortiAI.
# Create a Blueprint on Render and point it at this repository, or create the
# two services manually with the same settings.
#
# Order matters on a first deploy: the API must exist before the frontend builds,
# because the frontend compiles VITE_API_BASE_URL into its bundle.
services:
  # ---------------------------------------------------------------- Backend
  - type: web
    name: portiai-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in the Render dashboard
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_PROJECT_CREDITS_MONTHLY
        value: "20"
      # Razorpay: add the three secrets in the Render dashboard. The webhook
      # URL is https://<api-host>/api/subscription/webhook/razorpay.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PREMIUM_PRICE_INTRO
        value: "9"
      - key: PREMIUM_PRICE_MONTHLY
        value: "299"
      - key: PREMIUM_PRICE_YEARLY
        value: "3050"
      - key: PREMIUM_PRICE_YEARLY_ORIGINAL
        value: "3588"
      # Comma-separated emails allowed to open the admin dashboard.
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Browser origins allowed to call the API with the session cookie.
      # Comma-separate additional origins (e.g. a Vercel deployment).
      # https://portiai-frontend.onrender.com is always allowed by the code as
      # well, so a stale value here can no longer break the deployed site.
      - key: CLIENT_URL
        value: https://portiai-frontend.onrender.com
      - key: AI_DAILY_REQUEST_CAP
        value: "200"

  # --------------------------------------------------------------- Frontend
  - type: web
    name: portiai-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Compiled into the bundle at build time — changing it requires a rebuild.
      # `npm run build` fails on Render if this is missing or unusable.
      - key: VITE_API_BASE_URL
        value: https://portiai-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
